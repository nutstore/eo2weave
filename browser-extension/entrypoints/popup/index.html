<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- No <title> on purpose: WXT derives the toolbar tooltip
       (action.default_title) from the popup <title> and it OVERRIDES the
       per-mode default_title set in wxt.config.ts (dev vs prod naming).
       Omitting it lets the manifest config control the tooltip. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Slim scrollbars — the narrow 360px popup makes the default chunky
       scrollbar especially obtrusive. Neutral gray, matches the card borders. */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafaf8;
      color: #171717;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      background: #0d9488;
      color: #fff;
    }
    .title-wrap {
      flex: 1;
      min-width: 0;
    }
    .title {
      font-size: 15px;
      line-height: 1.2;
    }
    .subtitle {
      margin-top: 2px;
      font-size: 11px;
      opacity: 0.92;
    }
    .build-mode {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.12);
    }
    .build-mode.dev { color: #fef3c7; }
    .build-mode.prod { color: #dcfce7; }
    .main {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    /* L1 primary action: the single dominant button of the popup.
       Solid teal resting fill with tinted whisper-shadow — matches the
       popup logo gradient (`#14B8A6 → #0d7377`) at its mid-stop, so the
       chrome and the action feel like one surface. */
    .cta {
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #0d9488;
      color: #fff;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      box-shadow: 0 1px 3px rgba(13, 148, 136, 0.3);
      transition: background-color 0.12s, box-shadow 0.12s, transform 0.12s;
    }
    .cta:hover { background: #0b7a7a; box-shadow: 0 1px 4px rgba(13, 148, 136, 0.5); }
    .cta:active { transform: scale(0.98); }
    .cta-hint {
      font-size: 10.5px;
      color: #585858;
      /* left-aligned to match the rest of the popup's body type; the
         long instructional sentence (3 actions in one line) reads 30%
         faster when not re-centered per line in the narrow 360px column. */
      margin-top: 6px;
    }
    /* L2 capability line: quiet status block. Two structured rows —
       row 1 search status, row 2 (only when tools exist) tool count +
       manage toggle right-aligned. Prevents the mid-sentence wrap a
       single long line produced at 360px. */
    .capline {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      color: #585858;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 7px 10px;
    }
    .cap-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .cap-row > span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .capline .cap-dot { font-size: 9px; flex: 0 0 auto; }
    .capline .cap-dot.ok { color: #2d8a4e; }
    .capline .cap-dot.warn { color: #b86e0d; }
    .capline .cap-tools-row { padding-left: 15px; }
    .capline .mgr {
      margin-left: auto;
      color: #0f766e;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
      user-select: none;
    }
    .capline .mgr:hover { text-decoration: underline; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #f0f0f0;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 11px;
    }
    .codex-box {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px;
    }
    .codex-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #0f766e;
      color: #fff;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .codex-btn.secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .codex-log {
      margin-top: 10px;
      white-space: pre-wrap;
      font-size: 11px;
      line-height: 1.5;
      color: #475569;
      max-height: 120px;
      overflow: auto;
    }
    .reset-credit-box {
      display: none;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
    }
    .reset-credit-summary {
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: #92400e;
    }
    .reset-credit-meta {
      margin-top: 4px;
      font-size: 10px;
      color: #a16207;
    }
    .reset-credit-btn {
      width: auto;
      margin-top: 8px;
      padding: 6px 9px;
      background: #c9922e;
      font-size: 11px;
    }
    /* Usage refresh: icon button beside "updated at". 24px square keeps a
       comfortable touch target while staying visually quiet. */
    #usageRefreshBtn {
      width: 24px;
      height: 24px;
      padding: 0;
      font-size: 15px;
      line-height: 1;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.15s;
    }
    #usageRefreshBtn:hover {
      background: #f0fdfa;
      color: #0d9488;
    }
    #usageRefreshBtn:active {
      transform: scale(0.92);
    }
    /* Focus rings — match the popup's brand teal (logo mid-stop). Mouse
       click stays clean; only keyboard navigation reveals the ring. */
    .cta:focus-visible,
    .footer-link:focus-visible,
    .codex-btn:focus-visible,
    #copyCodeBtn:focus-visible,
    #usageRefreshBtn:focus-visible,
    .capline .mgr:focus-visible,
    .webmcp-toggle:focus-visible,
    .webmcp-host-left:focus-visible,
    .webmcp-group-left:focus-visible {
      outline: 2px solid #0d9488;
      outline-offset: 2px;
    }

    a { color: #0d9488; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .footer {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .footer-link {
      flex: 1;
      border: 1px solid #e5e5e5;
      background: #fff;
      color: #585858;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .footer-link:hover {
      background: #fafaf8;
      border-color: #d4d4d4;
    }
    /* WebMCP discovered tools (mirrors the web app's Settings → WebMCP host list) */
    .webmcp-box {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 10px 12px;
    }
    /* Cap the host list height: many discovered sites would otherwise stretch
       the popup past Chrome's 600px max, triggering an ugly page-level
       scrollbar on the 360px-wide edge. Scroll inside the box instead. */
    .webmcp-list-scroll {
      max-height: 264px;
      overflow-y: auto;
      /* keep the inner scroll from chaining to the popup body */
      overscroll-behavior: contain;
    }
    .webmcp-summary {
      font-size: 11px;
      font-weight: 600;
      color: #0d9488;
      margin-bottom: 8px;
    }
    /* Zero-tools setup guide (rendered inside webmcpBox when discovery
       finds nothing): explains the browser-side WebMCP switch, its
       Chromium version window, and opens chrome://flags in one click. */
    .webmcp-guide-text {
      font-size: 11px;
      line-height: 1.55;
      color: #525252;
    }
    .webmcp-guide-btn {
      margin-top: 7px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid #d4d4d4;
      background: #fafaf8;
      color: #171717;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .webmcp-guide-btn:hover {
      background: #efefec;
      border-color: #bdbdbd;
    }
    .webmcp-guide-ver {
      margin-top: 6px;
      font-size: 10px;
      color: #a3a3a3;
      line-height: 1.5;
    }
    /* Host card: vertical container — header row + nested group rows */
    .webmcp-host {
      padding: 4px 0;
    }
    .webmcp-host.disabled-host {
      opacity: 0.55;
    }
    .webmcp-host-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .webmcp-host-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .webmcp-host-left:hover {
      background: #f0fdfa;
    }
    .webmcp-host-name {
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #334155;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .webmcp-host.disabled-host .webmcp-host-name {
      text-decoration: line-through;
      text-decoration-color: #94a3b8;
    }
    .webmcp-host-count {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 600;
      color: #0d9488;
      background: #f4f8f7;
      border: 1px solid #d5e8e5;
      border-radius: 999px;
      padding: 1px 7px;
    }
    .webmcp-host.disabled-host .webmcp-host-count {
      color: #585858;
      background: #f8f7f5;
      border-color: #e5e5e5;
    }
    /* Per-host authorization switch (mirrors web app's WebMCPHostList) */
    .webmcp-toggle {
      position: relative;
      width: 30px;
      height: 17px;
      flex: 0 0 auto;
      appearance: none;
      -webkit-appearance: none;
      background: #cbd5e1;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
    }
    .webmcp-toggle::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
    }
    .webmcp-toggle:checked {
      background: #0d9488;
    }
    .webmcp-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
      transition: transform 0.15s;
    }
    .webmcp-toggle:checked::after {
      transform: translateX(13px);
    }
    .webmcp-toggle:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* Nested group rows: indent with padding only (craft-floor bans >1px
       side-stripe borders). Color is teal-tinted to harmonize with the
       Brand-Muted Rule (DESIGN.md). */
    .webmcp-groups {
      margin-top: 2px;
      margin-left: 10px;
      padding-left: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .webmcp-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 6px;
      border-radius: 6px;
    }
    .webmcp-group:hover {
      background: #f8fafc;
    }
    .webmcp-group.disabled-host {
      opacity: 0.55;
    }
    .webmcp-group-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }
    .webmcp-group-name-wrap {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .webmcp-group-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .webmcp-group-name {
      font-size: 11px;
      font-weight: 500;
      color: #334155;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 0 1 auto;
    }
    .webmcp-group.disabled-host .webmcp-group-name {
      text-decoration: line-through;
      text-decoration-color: #94a3b8;
    }
    .webmcp-group-count {
      flex: 0 0 auto;
      font-size: 9px;
      font-weight: 600;
      color: #0d9488;
      background: #f4f8f7;
      border: 1px solid #d5e8e5;
      border-radius: 999px;
      padding: 0 6px;
    }
    .webmcp-group-preview {
      font-size: 10px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Supported Sites entry — opens the recipes management page */
    .sites-entry {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .sites-entry:hover { background: #fafaf8; border-color: #d4d4d4; }
    .sites-entry:focus-visible { outline: 2px solid #0d9488; outline-offset: 2px; }
    .sites-icon { font-size: 16px; flex: 0 0 auto; }
    .sites-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .sites-title { font-size: 12px; font-weight: 600; color: #171717; }
    .sites-subtitle { font-size: 10.5px; color: #737373; }
    .sites-chevron { color: #a3a3a3; font-size: 16px; flex: 0 0 auto; }
  </style>
</head>
<body>
  <header class="header">
    <div class="title-wrap">
      <div class="title" data-i18n="extensionName">EO2Weave</div>
      <div class="subtitle" data-i18n="popupSubtitle">浏览器里的 AI 工作台</div>
    </div>
    <div id="buildMode" class="build-mode" hidden></div>
  </header>

  <main class="main">
    <button id="openWorkbenchBtn" class="cta" data-i18n="openSidePanel">打开侧边栏</button>
    <div class="cta-hint" data-i18n="openWorkbenchHint">在侧边栏中与 AI 对话、搜索网页、操作页面</div>
    <button id="supportedSitesBtn" class="sites-entry" type="button">
      <span class="sites-icon">🌐</span>
      <span class="sites-text">
        <span class="sites-title" data-i18n="supportedSites">Supported Sites</span>
        <span class="sites-subtitle" id="sitesSubtitle">—</span>
      </span>
      <span class="sites-chevron">›</span>
    </button>
    <div class="capline" id="capline">
      <div class="cap-row">
        <span class="cap-dot ok" id="capDot">●</span>
        <span id="capText" data-i18n="checking">检测中…</span>
      </div>
      <div class="cap-row cap-tools-row" id="capToolsRow" style="display:none">
        <span id="capToolsText"></span>
        <span class="mgr" id="mgrToggle" style="display:none">管理 ▾</span>
      </div>
    </div>
    <div id="webmcpBox" class="webmcp-box" style="display:none">
      <div id="webmcpSummary" class="webmcp-summary">Scanning tabs…</div>
      <!-- Zero-tools setup guide: how to enable the browser-side WebMCP
           switch (built by popup/main.ts renderNoTools → buildGuide). -->
      <div id="webmcpGuide" style="display:none"></div>
      <div id="webmcpList" class="webmcp-list-scroll"></div>
    </div>
    <!-- External agent MCP bridge — exposes WebMCP tools to out-of-browser
         MCP clients (Codex, Claude Code, Cursor, …) via the native host daemon
         (loopback TCP + --mcp-stdio helper). -->
    <div id="webmcpBridgeBox" class="webmcp-box" style="display:none">
      <div class="webmcp-host-head">
        <div class="webmcp-host-left" id="bridgeInfoRow" role="button" tabindex="0">
          <span class="webmcp-host-name" data-i18n="bridgeTitle">Agent 桥接（MCP）</span>
        </div>
        <input type="checkbox" class="webmcp-toggle" id="bridgeToggle" aria-label="Toggle external agent MCP bridge" />
      </div>
      <div id="bridgeStatusText" style="font-size:10.5px;color:#737373;margin-top:4px;">…</div>
      <div id="bridgeCmdBox" style="display:none;margin-top:8px;">
        <div style="font-size:10px;color:#737373;margin-bottom:3px;" data-i18n="bridgeMcpCmdTitle">MCP 客户端接入命令（点击复制）</div>
        <code id="bridgeCmdCodex" title="Codex CLI" style="display:block;white-space:nowrap;overflow-x:auto;padding:5px 7px;cursor:pointer;font-size:10px;margin-bottom:4px;">…</code>
        <code id="bridgeCmdClaude" title="Claude Code" style="display:block;white-space:nowrap;overflow-x:auto;padding:5px 7px;cursor:pointer;font-size:10px;">…</code>
      </div>
    </div>
    <div class="codex-box">
      <div id="codexStatus" style="margin-bottom: 8px; font-size: 12px; color: #6b7280;">
        <span id="codexStatusDot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#d1d5db;vertical-align:middle;margin-right:6px;"></span>
        <span id="codexStatusText" data-i18n="checkingAuthStatus">Checking auth status…</span>
      </div>

      <div id="codexUsage" style="display:none; margin-bottom: 10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <div style="font-size: 11px; font-weight: 600; color: #374151;" data-i18n="codexUsage">Codex Usage</div>
          <span id="usagePlan" style="font-size:10px;padding:1px 6px;border-radius:4px;background:#f0fdfa;color:#0d9488;font-weight:500;"></span>
        </div>
        <div id="usagePrimary" style="margin-bottom: 6px;"></div>
        <div id="usageSecondary" style="margin-bottom: 4px;"></div>
        <div id="usageSpend" style="display:none;font-size:10px;color:#6b7280;margin-bottom:2px;"></div>
        <div id="usageModels" style="display:none;font-size:10px;color:#6b7280;margin-bottom:2px;"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div id="usageUpdated" style="font-size: 10px; color: #9ca3af;"></div>
          <button id="usageRefreshBtn" title="Refresh usage" aria-label="Refresh usage" data-i18n-title="refreshUsageTitle">⟳</button>
        </div>
      </div>

      <div id="resetCreditBox" class="reset-credit-box">
        <div class="reset-credit-summary">
          <span data-i18n="resetCreditsAvailable">手动重置额度</span>
          <strong id="resetCreditCount"></strong>
        </div>
        <div id="resetCreditMeta" class="reset-credit-meta"></div>
        <button id="resetCreditBtn" class="codex-btn reset-credit-btn" data-i18n="useResetCredit">使用一次重置</button>
      </div>

      <div id="deviceCodeBox" style="display:none; margin-bottom: 10px; padding: 8px 10px; background: #f4f8f7; border: 1px solid #d5e8e5; border-radius: 8px;">
        <div style="font-size: 10px; color: #6b7280; margin-bottom: 4px;" data-i18n="deviceCode">Device Code</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <code id="deviceCodeText" style="flex: 1; font-size: 14px; font-weight: 700; letter-spacing: 1px; color: #2d4745; font-family: 'SF Mono', 'Fira Code', monospace;"></code>
          <button id="copyCodeBtn" style="border: none; background: none; cursor: pointer; padding: 2px 6px; color: #6b7280; font-size: 11px; border-radius: 4px; transition: all 0.15s;" data-i18n-title="copyCode">📋</button>
        </div>
        <div id="deviceCodeLink" style="font-size: 10px; margin-top: 4px;"></div>
      </div>

      <button id="codexLoginBtn" class="codex-btn" data-i18n="startDeviceCodeLogin">Start Device Code Login</button>
      <button id="codexResetBtn" class="codex-btn secondary" data-i18n="resetLogin">重新开始（清除状态）</button>
      <div id="codexLog" class="codex-log"></div>
    </div>

    <footer class="footer">
      <button id="openDocs" class="footer-link" data-i18n="documentation">使用文档</button>
      <button id="openGithub" class="footer-link" data-i18n="github">GitHub</button>
    </footer>
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
