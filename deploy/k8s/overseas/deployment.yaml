# ============================================================================
# EO2Weave international (weave.eo2suite.com) — Deployment
#
# Ops requirements:
#   - AKS abroad cluster, namespace: creatorweave
#   - F5 nginx ingress controller (new style, NOT the legacy ingress),
#     host weave.eo2suite.com, TLS secret eo2suite-com-tls
#   - Publish via Jenkins pipeline using the `aks-abroad` credential
#
# Region is a BUILD-TIME switch (NEXT_PUBLIC_DEPLOY_REGION=global), so this
# deployment is hard-pinned to global-region images. A cn image (Chinese
# privacy policy / 怡氧®AI branding) must never roll out here — the pod
# label + selector below enforce that at the k8s level.
#
# The REPLACE_IMAGE marker is substituted by the Jenkins pipeline before
# `kubectl apply`.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weave-web
  labels:
    app.kubernetes.io/name: weave-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: creatorweave
    creatorweave.io/deploy-region: global
spec:
  replicas: 2
  # NOTE: no explicit strategy block — this cluster's API schema rejects even
  # standard fields (maxSurge/maxUnavailable) in apps/v1 DeploymentStrategy
  # (server-side dry-run: "unknown field"). The default RollingUpdate
  # (maxUnavailable/maxSurge 25%) rounds maxUnavailable to 0 for 2 replicas,
  # i.e. rolling updates still replace pods without dropping availability.
  selector:
    matchLabels:
      app.kubernetes.io/name: weave-web
      creatorweave.io/deploy-region: global
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weave-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: creatorweave
        creatorweave.io/deploy-region: global
    spec:
      imagePullSecrets:
        - name: jcr-aks-registry
      containers:
        - name: web
          # Replaced by the Jenkins pipeline before kubectl apply.
          image: REPLACE_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Informational only — the effective region was inlined at build
            # time (NEXT_PUBLIC_DEPLOY_REGION in next.config.mjs / Dockerfile).
            - name: NEXT_PUBLIC_DEPLOY_REGION
              value: global
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 30
